# cPanel » Git™ Version Control » "Deploy HEAD Commit" runs these tasks.
# The repository is cloned directly into the application root, so deploying
# only needs the release steps (no file copying).
---
deployment:
  tasks:
    - export APP_DIR=$HOME/egofit
    - SKIP_PULL=1 /bin/bash $APP_DIR/deploy/deploy.sh > $HOME/egofit-deploy.log 2>&1 || (cat $HOME/egofit-deploy.log; exit 1)
